# Lightweight CI: checks that all Python files compile and all shell scripts parse.
# (Training/inference need GPUs and are not run in CI.)
language: python
python:
  - "3.11"

install: skip

script:
  - python -m compileall -q GeoVLM_Eval GeoVLM_inference train
  - for f in $(find . -name '*.sh' -not -path './.git/*'); do bash -n "$f" || exit 1; done
